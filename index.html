<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>procrastispinner</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>procrastispinner</h1>

        <div class="input-section">
            <label for="items-input">Enter items (one per line):</label>
            <textarea id="items-input" rows="8" placeholder="Pizza&#10;Movie Night&#10;Workout&#10;Study&#10;Game Time&#10;Clean Room"></textarea>
            <button id="create-wheel-btn">Create Wheel</button>
        </div>

        <div class="wheel-section" style="display: none;">
            <div class="wheel-container">
                <div class="pin"></div>
                <canvas id="wheel-canvas"></canvas>
                <button id="spin-btn">SPIN</button>
            </div>
            <button id="reset-btn">Reset</button>
            <div id="timer-display" style="display: none;"></div>
        </div>
    </div>

    <!-- Result Modal -->
    <div id="result-modal" class="modal">
        <div class="modal-content">
            <h2>🎉 You landed on: <span id="selected-item"></span></h2>
            <p class="accept-text">Accept task?</p>
            <p class="timer-label">Set timer:</p>
            <div class="timer-input-container">
                <input type="number" id="timer-input" min="1" max="60" value="25">
                <span>minutes</span>
            </div>
            <button id="start-btn" class="start-btn">START</button>
            <p class="skip-text">skip for now</p>
        </div>
    </div>

    <!-- Alert Modal -->
    <div id="alert-modal" class="modal">
        <div class="modal-content alert-modal-content">
            <p id="alert-message"></p>
            <button id="alert-ok-btn" class="alert-ok-btn">OK</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
