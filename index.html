<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>procrastispinner</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="main-content">
            <h1>procrastispinner</h1>

            <div class="input-section">
                <label for="items-input">Enter items (one per line):</label>
                <textarea id="items-input" rows="8" placeholder="bills&#10;water plants&#10;read the manual&#10;gym&#10;pet cat&#10;10 squats&#10;drink water"></textarea>
                <button id="create-wheel-btn">Create Wheel</button>
            </div>

            <div class="wheel-section" style="display: none;">
                <div class="wheel-container">
                    <div class="pin"></div>
                    <canvas id="wheel-canvas"></canvas>
                    <button id="spin-btn">SPIN</button>
                </div>
                <button id="reset-btn">Reset</button>
                <div id="timer-display" style="display: none;">
                    <div id="timer-text"></div>
                    <button id="done-btn">Done</button>
                </div>
            </div>
        </div>

        <!-- Completed Tasks Sidebar -->
        <div id="completed-sidebar" style="display: none;">
            <h3>Completed</h3>
            <div id="completed-list"></div>
        </div>
    </div>

    <!-- Result Modal -->
    <div id="result-modal" class="modal">
        <div class="modal-content">
            <p class="modal-title">You landed on <strong id="selected-item"></strong>.</p>
            <p class="modal-subtitle">Accept task and set a timer?</p>
            <div class="timer-input-container">
                <input type="number" id="timer-input" min="1" max="60" value="25">
                <span>minutes</span>
            </div>
            <button id="start-btn" class="start-btn">Start Timer</button>
            <p class="skip-text">skip for now</p>
        </div>
    </div>

    <!-- Alert Modal -->
    <div id="alert-modal" class="modal">
        <div class="modal-content alert-modal-content">
            <p id="alert-message"></p>
            <button id="alert-ok-btn" class="alert-ok-btn">OK</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
